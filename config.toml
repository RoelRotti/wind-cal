[spot]
id = 1120682
name = "Wijk aan Zee, NL"
timezone = "Europe/Amsterdam"

[forecast]
# primary_model is used for whatever forecast horizon it covers (HARM-NL is
# high-resolution and Netherlands-specific, but only covers ~2-3 days out);
# fallback_model fills in the remaining horizon beyond that.
# Full model list: http://micro.windguru.cz/help.php
primary_model = "harmnl"
fallback_model = "gfs"

[thresholds]
min_avg_wind_kt = 16.0
min_duration_hours = 4.0

[output]
ics_path = "docs/wijk-aan-zee-wind.ics"
status_path = "docs/status.json"
calendar_name = "Wijk aan Zee Wind"
